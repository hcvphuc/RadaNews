name: Daily Generate + Deploy

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      AI_RADAR_USE_OLLAMA: ${{ secrets.AI_RADAR_USE_OLLAMA }}
      AI_RADAR_MAX_ITEMS_PER_SOURCE: 5
      OLLAMA_ENDPOINT: ${{ secrets.OLLAMA_ENDPOINT }}
      OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run daily
      - run: npm run check
      - run: npm run build
      - name: Commit generated content
        run: |
          git config user.name "ai-radar-bot"
          git config user.email "ai-radar-bot@users.noreply.github.com"
          git add content apps/web/public/data
          if ! git diff --cached --quiet; then
            git commit -m "chore: daily AI Radar generation"
            git push
          fi

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_hqAfomj61Bh3Oo5m3QokuWtzyvZL
          VERCEL_ORG_ID: team_Sd6apx5desRR3EP7N5vo2xFa
        run: npx vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN" --yes
